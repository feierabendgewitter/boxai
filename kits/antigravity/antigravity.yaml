# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: workload
displayName: Google Antigravity
description: Antigravity CLI (agy) für boxai; experimentell, keine offizielle sbx-Integration
capabilities:
  - type: com.docker.sandbox/sbx@1
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - antigravity.google
          - edgedl.me.gvt1.com
          - "*.googleapis.com"
          - accounts.google.com
          - oauth2.googleapis.com
