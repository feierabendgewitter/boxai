# Werte werden referenziert, damit diese Datei keine Geheimnisse enthält.
secrets:
  - name: MAVEN_TOKEN
    hosts: ["nexus.firma.de"]
    value: ${env:NEXUS_TOKEN}
  - name: NPM_TOKEN
    hosts: ["registry.npmjs.org"]
    value: ${file:~/.secrets/npm}
  - name: GITLAB_TOKEN
    hosts: ["gitlab.com"]
    value: ${env:GITLAB_TOKEN}
